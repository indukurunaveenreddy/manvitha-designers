<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 100" width="460" height="100">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E5AB"/>
      <stop offset="25%" stop-color="#D4AF37"/>
      <stop offset="60%" stop-color="#AA771C"/>
      <stop offset="85%" stop-color="#E6C762"/>
      <stop offset="100%" stop-color="#8A5A14"/>
    </linearGradient>
    <linearGradient id="goldGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8A5A14"/>
      <stop offset="40%" stop-color="#D4AF37"/>
      <stop offset="70%" stop-color="#FFF1B0"/>
      <stop offset="100%" stop-color="#B38222"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Crest / Monogram Container -->
  <g transform="translate(10, 10)">
    <!-- Outer Octagonal / Rounded Shield Ring with Stitch dashes -->
    <circle cx="40" cy="40" r="37" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" />
    <circle cx="40" cy="40" r="34" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-dasharray="3, 2" />
    <circle cx="40" cy="40" r="30" fill="#1a050d" fill-opacity="0.8" stroke="url(#goldGrad2)" stroke-width="0.8" />

    <!-- Royal Crown on Top -->
    <path d="M28 27 L31 34 L36 29 L40 34 L44 29 L49 34 L52 27 L51 36 L29 36 Z" fill="url(#goldGrad)" />
    <circle cx="28" cy="26" r="1.2" fill="#FFF1B0" />
    <circle cx="36" cy="28" r="1.2" fill="#FFF1B0" />
    <circle cx="40" cy="25" r="1.5" fill="#FFF1B0" />
    <circle cx="44" cy="28" r="1.2" fill="#FFF1B0" />
    <circle cx="52" cy="26" r="1.2" fill="#FFF1B0" />

    <!-- Monogram Letters M & D Intertwined -->
    <!-- M -->
    <path d="M26 59 L26 40 L33 54 L40 40 L40 59 M24 40 L28 40 M24 59 L29 59" fill="none" stroke="url(#goldGrad)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
    <!-- D overlapping -->
    <path d="M39 40 L45 40 C52 40 56 44 56 49.5 C56 55 51 59 45 59 L39 59 Z" fill="none" stroke="url(#goldGrad2)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Stylized Embroidery Needle slicing through center -->
    <path d="M48 24 L31 66" stroke="url(#goldGrad)" stroke-width="1.4" stroke-linecap="round" />
    <!-- Thread eye and thread loop -->
    <ellipse cx="47.5" cy="25.5" rx="0.7" ry="1.8" transform="rotate(-22 47.5 25.5)" fill="#1a050d" stroke="url(#goldGrad)" stroke-width="0.6" />
    <path d="M48.5 24 Q55 20 57 26 Q59 34 53 38" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" stroke-dasharray="2, 1.5" />

    <!-- Little Diamond Base -->
    <polygon points="40,63 42,65 40,67 38,65" fill="url(#goldGrad)" />
  </g>

  <!-- Typography: MANVITHA DESIGNERS -->
  <g transform="translate(100, 18)">
    <text x="0" y="36" font-family="'Cinzel', 'Playfair Display', 'Cormorant Garamond', 'Georgia', serif" font-size="27" font-weight="700" letter-spacing="3.5" fill="#FAF8F5">
      MANVITHA
    </text>
    <text x="0" y="59" font-family="'Cinzel', 'Playfair Display', 'Cormorant Garamond', 'Georgia', serif" font-size="18" font-weight="600" letter-spacing="4.5" fill="url(#goldGrad)">
      DESIGNERS
    </text>
    <line x1="0" y1="68" x2="240" y2="68" stroke="url(#goldGrad)" stroke-width="0.8" stroke-opacity="0.6" />
    <text x="0" y="78" font-family="'Inter', 'Plus Jakarta Sans', sans-serif" font-size="7.5" font-weight="600" letter-spacing="2" fill="#D4AF37">
      COMPUTER EMBROIDERY SYSTEMS &bull; ANANTAPUR
    </text>
  </g>
</svg>